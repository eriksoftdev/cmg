<!-- Paginación -->
<nav class="mt-3">
  <ul class="pagination justify-content-center">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link" href="?{{ params }}&{{ page_param }}={{ page_obj.previous_page_number }}&tab={{ tab_id }}">Anterior</a>
      </li>
    {% endif %}

    <li class="page-item active">
      <span class="page-link">{{ page_obj.number }}</span>
    </li>

    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link" href="?{{ params }}&{{ page_param }}={{ page_obj.next_page_number }}&tab={{ tab_id }}">Siguiente</a>
      </li>
    {% endif %}
  </ul>
</nav>
<!-- Fin Paginación -->
