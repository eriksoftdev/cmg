<style>
    /* Usamos una clase en lugar del ID con Django para evitar errores de sintaxis */
    .modal-body fieldset[disabled] .form-control {
        background-color: #ffffff !important;
        color: #212529 !important;
        opacity: 1 !important;
        border: 1px solid #ced4da !important;
    }
</style>

<div class="modal fade" id="detailsPrepagoModal{{ venta_prepago.id }}" tabindex="-1" aria-labelledby="exampleModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h1 class="modal-title fs-5" id="exampleModalLabel">
                    Detalles Venta Prepago
                </h1>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form>
                    <!-- Los campos se colocan en fieldset desabilitados  para que solo sean de lectura-->
                    <fieldset disabled>
                        <!-- Se muestran los campos con los datos de la venta en 3 columns-->
                        <div class="row text-start">
                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">NOMBRE(S)</label>
                                <input type="text" name="nombre" class="form-control"
                                    value="{{ venta_prepago.nombre }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">APELLIDO PATERNO</label>
                                <input type="text" name="apellido_paterno" class="form-control"
                                    value="{{ venta_prepago.apellido_paterno }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">APELLIDO MATERNO</label>
                                <input type="text" name="apellido_materno" class="form-control"
                                    value="{{ venta_prepago.apellido_materno|default:'' }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">CURP</label>
                                <input type="text" name="curp" class="form-control" value="{{ venta_prepago.curp }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">DN</label>
                                <input type="text" name="dn" class="form-control" value="{{ venta_prepago.dn }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">NIP</label>
                                <input type="text" name="nip" class="form-control" value="{{ venta_prepago.nip }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">FVC</label>
                                <input type="text" name="fvc" class="form-control"
                                    value="{{ venta_prepago.fvc|date:'Y-m-d' }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">CONTACTO 1</label>
                                <input type="text" name="contact1" class="form-control"
                                    value="{{ venta_prepago.contact1 }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">CONTACTO 2</label>
                                <input type="text" name="contact2" class="form-control"
                                    value="{{ venta_prepago.contact2 }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">EMAIL</label>
                                <input type="text" name="email" class="form-control" value="{{ venta_prepago.email }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">FOLIO</label>
                                <input type="text" name="folio" class="form-control" value="{{ venta_prepago.folio }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">USUARIO MARCADOR</label>
                                <input type="text" name="usuario_marcador" class="form-control"
                                    value="{{ venta_prepago.usuario_marcador }}">
                            </div>

                            <div class="col-md-4 mb-3">
                                <label class="form-label font-weight-bold">MARCADOR</label>
                                <input type="text" name="marcador" class="form-control"
                                    value="{{ venta_prepago.marcador }}">
                            </div>
                        </div>
                    </fieldset>
                    <!-- Termina el fieldset-->
                    <!--Termina seccion de campos de venta en 3 columns-->
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
