<!doctype html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg  navbar-dark shadow-sm" style="background-color: #1e40af;">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'dashboard' %}">Navbar</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <div class="dropdown">
              <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown"
                aria-expanded="false"><i class="bi bi-graph-up-arrow"></i>
                Ventas
              </button>
              <ul class="dropdown-menu dropdown-menu-dark">
                <li>
                  <a class="dropdown-item" href="{% url 'prepago' %}"><i
                      class="bi bi-phone-vibrate me-1"></i>Prepago</a>
                </li>
                <li>
                  <a class="dropdown-item" href="{% url 'pospago' %}"><i
                      class="bi bi-person-bounding-box me-1"></i>Pospago</a>
                </li>
                <li>
                  <a class="dropdown-item" href="{% url 'tarjetas' %}"><i
                      class="bi bi-credit-card-2-front me-1"></i>TDC</a>
                </li>
              </ul>
            </div>
          </li>
          <li class="nav-item ms-2">
            <a class="btn btn-outline-light" href="{% url 'notas' %}"><i class="bi bi-pencil-square me-1"></i>Notas</a>
          </li>

          <li class="nav-item ms-2">
            <div class="dropdown">
              <button class="btn btn-light text-dark ms-3" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <i class="bi bi-person-circle me-1"></i> <strong>{{ user.first_name }}</strong>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow">
                <li>
                  <form action="{% url 'logout' %}" method="POST">
                    {% csrf_token %}
                    <button type="submit" class="dropdown-item text-danger">
                      <i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión
                    </button>
                  </form>

                </li>
          </li>
        </ul>
      </div>
      </li>
      </ul>
    </div>
    </div>
  </nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>

{% block content %} {% endblock %}
